{% extends "base.html" %}
{% block title %}{{ code }} — {{ site.business_name }}{% endblock %}
{% block content %}
<section class="section"><div class="narrow center">
  <span class="eyebrow">Error {{ code }}</span>
  <h1>{{ message }}</h1>
  <p class="muted">If you think this is a mistake, please <a href="{{ url_for('public.contact') }}">contact us</a>.</p>
  <a class="btn btn-primary" href="{{ url_for('public.home') }}">Back to home</a>
</div></section>
{% endblock %}
